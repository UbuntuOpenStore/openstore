services:
  - mongo:latest

stages:
  - check
  - deploy

# Ref: https://docs.gitlab.com/ee/ci/caching/#cache-nodejs-dependencies
cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

before_script:
  - npm ci --cache .npm --prefer-offline

api-check:
  stage: check
  image: node:22
  script:
    - npm run type-check -w openstore-api
    - npm run lint -w openstore-api
    - npm run lint:json -w openstore-api
    - npm run test:ci -w openstore-api
    - npm run build -w openstore-api

web-check:
  stage: check
  image: node:22
  script:
    - npm run convert-po -w openstore-web
    - npm run check -w openstore-web
    - npm run build -w openstore-web

deploy:
  stage: deploy
  only:
    - master
  image: bhdouglass/openstore-ci
  script:
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add - > /dev/null
    - echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
    - VERSION=$(date +"%Y-%m-%d_%H-%M-%S")
    - echo $VERSION
    - npm run build -w openstore-api
    - npm run build -w openstore-web
    - tar -czf ../openstore_$VERSION.tar.gz --exclude .npm --exclude docker .
    - scp ../openstore_$VERSION.tar.gz brian@ssh.open-store.io:/srv/openstore-next/
    - ssh brian@ssh.open-store.io "/srv/openstore/post-deploy.sh $VERSION"
