image: bhdouglass/openstore-ci:2026-09-17

stages:
  - check
  - test
  - build
  - deploy

# Ref: https://docs.gitlab.com/ee/ci/caching/#cache-nodejs-dependencies
cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

before_script:
  - npm ci --cache .npm --prefer-offline

api-check:
  stage: check
  script:
    - npm run build -w click-parser
    - npm run type-check -w openstore-api
    - npm run lint -w openstore-api
    - npm run lint:json -w openstore-api
    - npm run format:check -w openstore-api

api-test:
  stage: test
  services:
    - mongo:latest
  script:
    - npm run build -w click-parser
    - npm run build -w openstore-dpkg
    - npm run test:ci -w openstore-api

api-build:
  stage: build
  script:
    - npm run build -w click-parser
    - npm run build -w openstore-api

web-check:
  stage: check
  script:
    - npm run convert-po -w openstore-web
    - npm run check -w openstore-web

web-build:
  stage: build
  script:
    - npm run convert-po -w openstore-web
    - npm run build -w openstore-web

dpkg-build:
  stage: build
  script:
    - npm run build -w openstore-dpkg

click-parser-check:
  stage: check
  script:
    - npm run lint -w click-parser
    - npm run type-check -w click-parser
    - npm run format:check -w click-parser

click-parser-test:
  stage: test
  script:
    - npm run build -w click-parser
    - npm run test -w click-parser

deploy:
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
  script:
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add - > /dev/null
    - echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
    - VERSION=$(date +"%Y-%m-%d_%H-%M-%S")
    - echo $VERSION
    - npm run build -w click-parser
    - npm run build -w openstore-api
    - npm run build -w openstore-web
    - npm run build -w openstore-dpkg
    - tar -czf ../openstore_$VERSION.tar.gz --exclude .npm --exclude docker --exclude .git .
    - scp ../openstore_$VERSION.tar.gz brian@ssh.open-store.io:/srv/openstore-next/
    - ssh brian@ssh.open-store.io "/srv/openstore/post-deploy.sh $VERSION"
